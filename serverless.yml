service: mobile-fetch

provider:
    name: aws
    # The AWS region in which to deploy (us-east-1 is the default)
    region: eu-west-2

    environment:
        MAINTENANCE_MODE: ${param:maintenance, null}
        FILESYSTEM_DISK: s3
        AWS_BUCKET: !Ref Storage

    iam:
        role:
            statements:
                - Effect: Allow
                  Action: s3:*
                  Resource:
                      - !Sub '${Storage.Arn}'
                      - !Sub '${Storage.Arn}/*'

package:
    # Files and directories to exclude from deployment
    patterns:
        - '!.github/**'
        - '!node_modules/**'
        - '!public/**'
        - 'public/index.php'
        - 'public/build/manifest.json'
        - '!resources/assets/**'
        - '!resources/css/**'
        - '!resources/js/**'
        - '!storage/**'
        - 'storage/binaries/replay_parser*'
        - '!tests/**'
        - '!database/*.sqlite'
        - '!_ide_helper*'
        - '!.editorconfig'
        - '!.env.example'
        - '!.gitattributes'
        - '!composer.lock'
        - '!package*.json'
        - '!phpunit.xml'
        - '!postcss.config.js'
        - '!*.md'
        - '!tailwind.config.js'
        - '!vite.config.js'
        - '!yarn.lock'
        - '!*.bak'

functions:

    # This function runs the Laravel website/API
    web:
        handler: public/index.php
        runtime: php-83-fpm
        timeout: 28 # in seconds (API Gateway has a timeout of 29 seconds)
        events:
            - httpApi: '*'

    # This function lets us run artisan commands in Lambda
    artisan:
        handler: artisan
        runtime: php-83-console
        timeout: 720 # in seconds
        # Uncomment to also run the scheduler every minute
        #events:
        #    - schedule:
        #          rate: rate(1 minute)
        #          input: '"schedule:run"'

constructs:
    website:
        type: server-side-website
        assets: # CDN assets
            "build/assets/*.css": public/build/assets
            "build/assets/*.js": public/build/assets
            "/favicon.ico": public/favicon.ico
            "/robots.txt": public/robots.txt
        domain:
            - www.mobilefetch.dk
            - mobilefetch.dk
        redirectToMainDomain: true
        certificate: arn:aws:acm:us-east-1:588738585363:certificate/0471a210-d86a-487c-92b6-9b792f9bb723

plugins:
    - ./vendor/bref/bref
    - serverless-lift

resources:
    Resources:
        Storage:
            Type: AWS::S3::Bucket
    Outputs:
        Storage:
            Value: !Ref Storage
